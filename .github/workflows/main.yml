name: Publish

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 1 */3 * *

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Git LFS
        run: |
          git lfs install

      - name: Download MaxMind GeoLite2 Databases
        env:
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
        run: |
          set -euo pipefail

          BASE_URL="https://download.maxmind.com/app/geoip_download"

          download() {
            edition=$1
            echo "Downloading $edition..."
            curl -fL --retry 3 \
              "${BASE_URL}?edition_id=${edition}&license_key=${LICENSE_KEY}&suffix=tar.gz" \
              -o "${edition}.tar.gz"
          }

          download "GeoLite2-ASN"
          download "GeoLite2-City"
          download "GeoLite2-Country"

          for file in *.tar.gz; do
            tar -xzf "$file"
          done

          mkdir -p upload

          find . -type f -name "*.mmdb" -exec cp -v {} upload/ \;
          cp -v *.tar.gz upload/

          echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

      - name: Push to "download" branch with Git LFS
        run: |
          set -e
          cd upload

          git init
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          # Enable LFS tracking
          git lfs install
          git lfs track "*.mmdb"

          git add .gitattributes
          git add *.mmdb
          git add *.tar.gz

          git checkout -b download
          git commit -m "${{ env.TAG_NAME }}"

          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin download

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          body: ${{ env.TAG_NAME }}
          files: |
            upload/*.mmdb
            upload/*.tar.gz

      - name: Remove old releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2
